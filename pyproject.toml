[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-fraud-investigator"
version = "0.1.0"
description = "Agentic AI Fraud Investigator — Andela Digital Bank"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "structlog==24.1.0",
    "anthropic==0.26.0",
    "langgraph==0.1.5",
    "langsmith==0.1.63",
    "asyncpg==0.29.0",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "instructor==1.3.3",
    "tenacity==8.3.0",
    "pandas==2.2.2",
    "streamlit==1.35.0",
    "plotly==5.22.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "hypothesis==6.100.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
