# Default: one app (Streamlit :8501 + internal FastAPI).
#   docker compose up --build
#
# Optional Postgres + Redis + API-only container (no Streamlit):
#   docker compose --profile fullstack up --build
#
# For fullstack, set POSTGRES_* and DATABASE_URL (and SECRET_KEY) in the environment or a .env file — no defaults are baked in.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      SKIP_DATABASE_INIT: "1"
      REQUIRE_DATABASE: "0"
      FRAUD_API_BASE: "http://127.0.0.1:8000"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      API_KEY: ${API_KEY:-}
      SECRET_KEY: ${SECRET_KEY}
    restart: unless-stopped

  stack-api:
    profiles: ["fullstack"]
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      - db
      - redis
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - fraud-investigator

  db:
    profiles: ["fullstack"]
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - fraud-investigator

  redis:
    profiles: ["fullstack"]
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - fraud-investigator

volumes:
  postgres_data:
  redis_data:

networks:
  fraud-investigator:
    driver: bridge
