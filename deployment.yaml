# Example Kubernetes manifest for the **one-app** image (Streamlit :8501; FastAPI on loopback inside the pod).
# Build/push: `docker build -f Dockerfile .` then tag and push to your registry.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-investigator
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-investigator
  template:
    metadata:
      labels:
        app: fraud-investigator
    spec:
      containers:
        - name: fraud-investigator
          image: 523476390411.dkr.ecr.us-east-1.amazonaws.com/agentic-ai-fraud-investigator:latest
          ports:
            - containerPort: 8501
          env:
            - name: SKIP_DATABASE_INIT
              value: "1"
            - name: REQUIRE_DATABASE
              value: "0"
            - name: FRAUD_API_BASE
              value: "http://127.0.0.1:8000"
            - name: ENVIRONMENT
              value: "production"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 40
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: fraud-investigator-ui
spec:
  selector:
    app: fraud-investigator
  ports:
    - port: 8501
      targetPort: 8501
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fraud-investigator-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fraud-investigator-ui
                port:
                  number: 8501
