apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-investigator
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-investigator
  template:
    metadata:
      labels:
        app: fraud-investigator
    spec:
      containers:
      - name: fraud-investigator
        image: 523476390411.dkr.ecr.us-east-1.amazonaws.com/agentic-ai-fraud-investigator:latest
        ports:
        - containerPort: 8000
        - containerPort: 8501
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:password@postgres:5432/fraud_investigator"
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: fraud-investigator-api
spec:
  selector:
    app: fraud-investigator
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: fraud-investigator-dashboard
spec:
  selector:
    app: fraud-investigator
  ports:
  - port: 8501
    targetPort: 8501
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fraud-investigator-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: fraud-investigator-api
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fraud-investigator-dashboard
            port:
              number: 8501
